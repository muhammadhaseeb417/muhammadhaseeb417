<svg width="920" height="230" viewBox="0 0 920 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090615" />
      <stop offset="50%" stop-color="#120b29" />
      <stop offset="100%" stop-color="#0a0718" />
    </linearGradient>

    <!-- Subtle Glowing Radial Highlights -->
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090615" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sideGlowLeft" cx="10%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090615" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sideGlowRight" cx="90%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090615" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.6" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2" />
    </linearGradient>

    <!-- Accent Hairline Gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="1" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="cardGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#231942" stroke-width="0.7" opacity="0.45" />
      <circle cx="0" cy="0" r="0.8" fill="#4c1d95" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="920" height="230" rx="14" fill="url(#bgGrad)" />
  <rect width="920" height="230" rx="14" fill="url(#centerGlow)" />
  <rect width="920" height="230" rx="14" fill="url(#sideGlowLeft)" />
  <rect width="920" height="230" rx="14" fill="url(#sideGlowRight)" />

  <!-- Grid Overlay -->
  <rect width="920" height="230" rx="14" fill="url(#cardGrid)" />

  <!-- Ambient Wave Layer 1 -->
  <path fill="url(#waveGrad1)" d="M0 230 L0 185 Q 230 160 460 180 T 920 170 L 920 230 Z" />

  <!-- Ambient Wave Layer 2 -->
  <path fill="url(#waveGrad2)" d="M0 230 L0 195 Q 230 175 460 195 T 920 180 L 920 230 Z" />

  <!-- Top Pill Badge -->
  <g transform="translate(360, 26)">
    <rect x="0" y="0" width="200" height="24" rx="12" fill="#180f33" stroke="#4c1d95" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#a78bfa" />
    <text x="26" y="15.5" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">FULL STACK &amp; APPLIED AI</text>
  </g>

  <!-- Main Name Title -->
  <text x="460" y="98" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="2.5">MUHAMMAD HASEEB AMJAD</text>

  <!-- Role Subtitle -->
  <text x="460" y="132" text-anchor="middle" dominant-baseline="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="3">SOFTWARE ENGINEER  &#183;  AI &amp; MOBILE SYSTEMS ARCHITECT</text>

  <!-- Subtle Horizontal Accent Divider -->
  <line x1="200" y1="158" x2="720" y2="158" stroke="url(#accentLine)" stroke-width="1.5" />

  <!-- Core Stack Metadata Ticker -->
  <text x="460" y="184" text-anchor="middle" dominant-baseline="middle" fill="#7e709e" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Segoe UI Mono', 'Fira Code', monospace" font-size="10.5" font-weight="500" letter-spacing="2">NEXT.JS  &#8226;  TYPESCRIPT  &#8226;  FLUTTER  &#8226;  TENSORFLOW LITE  &#8226;  NODE.JS  &#8226;  POSTGRESQL</text>

  <!-- Technical Corner Registration Crosshairs -->
  <g stroke="#4c1d95" stroke-width="1" opacity="0.8">
    <line x1="24" y1="20" x2="24" y2="32" />
    <line x1="18" y1="26" x2="30" y2="26" />
    <line x1="896" y1="20" x2="896" y2="32" />
    <line x1="890" y1="26" x2="902" y2="26" />
    <line x1="24" y1="198" x2="24" y2="210" />
    <line x1="18" y1="204" x2="30" y2="204" />
    <line x1="896" y1="198" x2="896" y2="210" />
    <line x1="890" y1="204" x2="902" y2="204" />
  </g>

  <!-- Card Border -->
  <rect x="0.5" y="0.5" width="919" height="229" rx="13.5" stroke="url(#borderGrad)" stroke-width="1" />
</svg>